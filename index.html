<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remit Calculator</title>
  <link rel="icon" type="image/png" href="foodpanda.jpg">
  <link rel="apple-touch-icon" href="foodpanda.jpg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f90081">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 16px;
    background: #fdf1f6;
    color: #24141d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  .container {
    max-width: 380px;
    margin: 0 auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 22px;
  }
  .brand-badge {
    width: 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
    margin-bottom: 10px;
    background: transparent;
    box-shadow: none;
  }
  .brand-badge img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .brand-name {
    font-size: 13px;
    font-weight: 700;
    color: #d7126a;
    letter-spacing: 0.01em;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    text-align: center;
  }
  p.desc {
    color: #8a6272;
    margin: 0 0 22px;
    font-size: 13.5px;
    text-align: center;
  }

  .card {
    background: #fff;
    border: 1px solid #f4d6e5;
    border-radius: 10px;
    padding: 22px;
  }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: #5c3d4c;
    margin-bottom: 6px;
  }
  .field { margin-bottom: 16px; }
  .amount-input {
    display: flex;
    align-items: center;
    border: 1.5px solid #f0c7dc;
    border-radius: 7px;
    padding: 0 12px;
    background: #fff;
    transition: border-color .12s ease;
  }
  .amount-input:focus-within { border-color: #d7126a; }
  .amount-input span {
    color: #c98aa8;
    font-weight: 600;
    margin-right: 6px;
    font-size: 15px;
  }
  input[type="number"] {
    border: none;
    outline: none;
    flex: 1;
    min-width: 0;
    padding: 11px 0;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    color: #24141d;
    background: transparent;
    font-variant-numeric: tabular-nums;
  }
  input[type="number"]::placeholder { color: #d9aec2; font-weight: 500; }

  hr {
    border: none;
    border-top: 1px dashed #f2d3e2;
    margin: 18px 0 14px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    font-size: 14px;
  }
  .row.gross-row {
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px dashed #f2d3e2;
  }
  .row .k {
    font-weight: 600;
    color: #8a6272;
    font-size: 13.5px;
  }
  .row .v {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: #24141d;
  }
  .row .v.neg { color: #a13d2e; }
  .row .v.pos { color: #167a3a; }

  .result {
    margin: 16px -22px -22px;
    padding: 18px 22px;
    background: #f90081;
    border-radius: 0 0 9px 9px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    transition: background-color .3s ease;
  }
  .result.flash { background: #000000; }
  .result .k {
    font-size: 15px;
    font-weight: 600;
    color: #f7f0f0;
  }
  .result .v {
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .result .v.neg { color: #f2b199; }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  .actions button {
    flex: 1;
    padding: 10px;
    font-size: 13.5px;
    font-weight: 600;
    font-family: inherit;
    border-radius: 7px;
    cursor: pointer;
    transition: background-color .12s ease, border-color .12s ease;
  }
  #copyBtn {
    background: #d7126a;
    color: #fff;
    border: 1px solid #d7126a;
  }
  #copyBtn:hover { background: #b70e58; }
  #copyBtn.copied { background: #24141d; border-color: #24141d; }
  #resetBtn {
    background: #fff;
    color: #5c3d4c;
    border: 1px solid #f0c7dc;
  }
  #resetBtn:hover { background: #fdf1f6; }

  /* ---------- Cliqq button ---------- */
  .cliqq-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    margin: 0 0 18px;
    padding: 12px 16px;
    border-radius: 12px;
    background: linear-gradient(135deg, #3dafe3, #4874eb);
    color: #fff;
    text-decoration: none;
    box-shadow: 0 6px 16px rgba(72, 116, 235, 0.28);
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .cliqq-btn::after {
    content: "";
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent);
    transform: skewX(-20deg);
    transition: left .5s ease;
  }
  .cliqq-btn:hover::after { left: 120%; }
  .cliqq-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(72, 116, 235, 0.38);
    filter: brightness(1.05);
  }
  .cliqq-btn:active {
    transform: translateY(0) scale(.98);
    box-shadow: 0 3px 8px rgba(72, 116, 235, 0.3);
  }
  .cliqq-btn:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 2px;
    box-shadow: 0 0 0 5px #4874eb;
  }
  .cliqq-icon {
    flex: none;
    width: 38px; height: 38px;
    display: grid; place-items: center;
    background: rgba(255,255,255,.2);
    border-radius: 10px;
  }
  .cliqq-text {
    flex: 1;
    display: flex;
    flex-direction: column;
    line-height: 1.25;
    text-align: left;
  }
  .cliqq-text strong { font-size: 15px; font-weight: 700; }
  .cliqq-text small { font-size: 12px; opacity: .85; }
  .cliqq-arrow { flex: none; transition: transform .2s ease; }
  .cliqq-btn:hover .cliqq-arrow { transform: translateX(4px); }

  .cliqq-btn.loading { pointer-events: none; filter: saturate(.7); }
  .cliqq-btn.loading .cliqq-arrow { animation: cliqq-spin .8s linear infinite; }
  @keyframes cliqq-spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .cliqq-btn, .cliqq-btn::after, .cliqq-arrow { transition: none; animation: none; }
  }

  .note {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: #b587a0;
    text-decoration: none;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="brand-badge"><img src="foodpanda_logo.png" alt="foodpanda logo"></div>
      <div class="brand-name">FOODPANDA</div>
    </div>

    <h1>Remit Calculator</h1>
    <p class="desc">Go to nearest 7-Eleven to remit</p>

    <a id="cliqqBtn" class="cliqq-btn"
       href="https://play.google.com/store/apps/details?id=com.cliqq.ph"
       target="_blank" rel="noopener">
      <span class="cliqq-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="2" width="12" height="20" rx="3"/>
          <line x1="11" y1="18" x2="13" y2="18"/>
        </svg>
      </span>
      <span class="cliqq-text">
        <strong id="cliqqLabel">Open Cliqq App</strong>
        <small>Remit your payment fast</small>
      </span>
      <svg class="cliqq-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>
    </a>

    <div class="card">
      <div class="field">
        <label for="payments">Payments</label>
        <div class="amount-input">
          <span>₱</span>
          <input type="number" id="payments" step="0.01" min="0" placeholder="0.00">
        </div>
      </div>

      <div class="field">
        <label for="wallet">Wallet</label>
        <div class="amount-input">
          <span>₱</span>
          <input type="number" id="wallet" step="0.01" min="0" placeholder="0.00">
        </div>
      </div>

      <hr>

      <div class="row">
        <span class="k">Payments</span>
        <span class="v" id="outPayments">₱0.00</span>
      </div>
      <div class="row">
        <span class="k">Fee (2%)</span>
        <span class="v neg" id="outFee">−₱0.00</span>
      </div>

      <div class="row gross-row">
        <span class="k">Gross Pay</span>
        <span class="v pos" id="outGross">₱0.00</span>
      </div>

      <div class="row">
        <span class="k">Wallet</span>
        <span class="v neg" id="outWallet">−₱0.00</span>
      </div>

      <div class="result" id="resultBox">
        <span class="k">Remit</span>
        <span class="v" id="outResult">₱0.00</span>
      </div>
    </div>

    <div class="actions">
      <button type="button" id="copyBtn">Copy result</button>
      <button type="button" id="resetBtn">Clear</button>
    </div>

    <p class="note">
      <a href="https://facebook.com/nilmaraxel" style="text-decoration: none; color: inherit;">UrDevNilmar</a>
    </p>
  </div>

<script>
  const FEE_RATE = 0.02;

  const paymentsEl = document.getElementById('payments');
  const walletEl = document.getElementById('wallet');
  const outPayments = document.getElementById('outPayments');
  const outFee = document.getElementById('outFee');
  const outGross = document.getElementById('outGross');
  const outWallet = document.getElementById('outWallet');
  const outResult = document.getElementById('outResult');
  const resultBox = document.getElementById('resultBox');
  const copyBtn = document.getElementById('copyBtn');
  const resetBtn = document.getElementById('resetBtn');

  let flashTimer = null;

  function fmt(n) {
    const sign = n < 0 ? '−' : '';
    return sign + '₱' + Math.abs(n).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function calc(animate) {
    const payments = parseFloat(paymentsEl.value) || 0;
    const wallet = parseFloat(walletEl.value) || 0;

    const fee = payments * FEE_RATE;
    const grossPay = payments - fee;
    const remit = grossPay - wallet;

    outPayments.textContent = fmt(payments);
    outFee.textContent = '−' + fmt(fee);
    outGross.textContent = fmt(grossPay);
    outWallet.textContent = '−' + fmt(wallet);
    outResult.textContent = fmt(remit);
    outResult.classList.toggle('neg', remit < 0);

    if (animate) {
      resultBox.classList.add('flash');
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => resultBox.classList.remove('flash'), 250);
    }

    try {
      localStorage.setItem('remit-calculator', JSON.stringify({ payments: paymentsEl.value, wallet: walletEl.value }));
    } catch (e) {}
  }

  try {
    const saved = JSON.parse(localStorage.getItem('remit-calculator') || 'null');
    if (saved) {
      paymentsEl.value = saved.payments || '';
      walletEl.value = saved.wallet || '';
    }
  } catch (e) {}

  paymentsEl.addEventListener('input', () => calc(true));
  walletEl.addEventListener('input', () => calc(true));

  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(outResult.textContent); } catch (e) {}
    const original = copyBtn.textContent;
    copyBtn.textContent = 'Copied';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = original;
      copyBtn.classList.remove('copied');
    }, 1200);
  });

  resetBtn.addEventListener('click', () => {
    paymentsEl.value = '';
    walletEl.value = '';
    try { localStorage.removeItem('remit-calculator'); } catch (e) {}
    calc(true);
    paymentsEl.focus();
  });

  calc(false);

  // ---------- Cliqq button ----------
 const PKG = 'com.philseven.loyalty2026';
const ACTIVITY = 'com.philseven.loyalty2026.MainActivity';
const PLAY_URL = 'https://play.google.com/store/apps/details?id=' + PKG;
const INTENT_URL =
  'intent://open#Intent;' +
  'action=android.intent.action.MAIN;' +
  'category=android.intent.category.LAUNCHER;' +
  'package=' + PKG + ';' +
  'component=' + PKG + '/' + ACTIVITY + ';' +
  'S.browser_fallback_url=' + encodeURIComponent(PLAY_URL) + ';end';
cliqqBtn.addEventListener('click', async (e) => {
  try { await navigator.clipboard.writeText('Dragon Loan'); } catch (err) {}

  if (/Android/i.test(navigator.userAgent)) {
    e.preventDefault();
    window.location.href = INTENT_URL;
  }
  cliqqBtn.classList.add('loading');
  cliqqLabel.textContent = 'Opening Cliqq…';
  if (navigator.vibrate) navigator.vibrate(15);
  setTimeout(() => {
    cliqqBtn.classList.remove('loading');
    cliqqLabel.textContent = 'Open Cliqq App';
  }, 2000);
});
</script>
</body>
</html>

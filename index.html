<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remit Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 16px;
    background: #f3f3f1;
    color: #1c1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  .container {
    max-width: 380px;
    margin: 0 auto;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    color: #0f7b3d;
    margin: 0 0 6px;
   text-aligment: center;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  p.desc {
    color: #6b6b66;
    margin: 0 0 22px;
    font-size: 14px;
  }

  .card {
    background: #fff;
    border: 1px solid #e2e1dc;
    border-radius: 10px;
    padding: 22px;
  }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: #45453f;
    margin-bottom: 6px;
  }
  .field { margin-bottom: 16px; }
  .amount-input {
    display: flex;
    align-items: center;
    border: 1.5px solid #d7d6cf;
    border-radius: 7px;
    padding: 0 12px;
    background: #fff;
    transition: border-color .12s ease;
  }
  .amount-input:focus-within { border-color: #1c1c1a; }
  .amount-input span {
    color: #8b8b84;
    font-weight: 600;
    margin-right: 6px;
    font-size: 15px;
  }
  input[type="number"] {
    border: none;
    outline: none;
    flex: 1;
    min-width: 0;
    padding: 11px 0;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    color: #1c1c1a;
    background: transparent;
    font-variant-numeric: tabular-nums;
  }
  input[type="number"]::placeholder { color: #b7b6ae; font-weight: 500; }

  hr {
    border: none;
    border-top: 1px dashed #ddddd6;
    margin: 18px 0 14px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    font-size: 14px;
  }
  .row .k { color: #6b6b66; }
  .row .v {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: #1c1c1a;
  }
  .row .v.neg { color: #a13d2e; }

  .result {
    margin: 16px -22px -22px;
    padding: 18px 22px;
    background: #14231b;
    border-radius: 0 0 9px 9px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    transition: background-color .3s ease;
  }
  .result.flash { background: #1c3327; }
  .result .k {
    font-size: 12.5px;
    font-weight: 600;
    color: #9db7a8;
  }
  .result .v {
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .result .v.neg { color: #f2b199; }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  .actions button {
    flex: 1;
    padding: 10px;
    font-size: 13.5px;
    font-weight: 600;
    font-family: inherit;
    border-radius: 7px;
    cursor: pointer;
    transition: background-color .12s ease, border-color .12s ease;
  }
  #copyBtn {
    background: #0f7b3d;
    color: #fff;
    border: 1px solid #0f7b3d;
  }
  #copyBtn:hover { background: #0c6531; }
  #copyBtn.copied { background: #1c1c1a; border-color: #1c1c1a; }
  #resetBtn {
    background: #fff;
    color: #45453f;
    border: 1px solid #d7d6cf;
  }
  #resetBtn:hover { background: #f6f6f4; }

  .note {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: #9a9a93;
  }
</style>
</head>
<body>
  <div class="container">
    <p class="eyebrow" style="text-align: center;">7-Eleven remittance</p>
   <h1 style="text-align: center;">Remit Calculator</h1>

    <div class="card">
      <div class="field">
        <label for="payments">Payments</label>
        <div class="amount-input">
          <span>₱</span>
          <input type="number" id="payments" step="0.01" min="0" placeholder="0.00">
        </div>
      </div>

      <div class="field">
        <label for="wallet">Wallet</label>
        <div class="amount-input">
          <span>₱</span>
          <input type="number" id="wallet" step="0.01" min="0" placeholder="0.00">
        </div>
      </div>

      <hr>

      <div class="row">
        <span class="k">Payments</span>
        <span class="v" id="outPayments">₱0.00</span>
      </div>
      <div class="row">
        <span class="k">Fee (2%)</span>
        <span class="v neg" id="outFee">−₱0.00</span>
      </div>
      <div class="row">
        <span class="k">Wallet</span>
        <span class="v neg" id="outWallet">−₱0.00</span>
      </div>

      <div class="result" id="resultBox">
        <span class="k">Remit</span>
        <span class="v" id="outResult">₱0.00</span>
      </div>
    </div>

    <div class="actions">
      <button type="button" id="copyBtn">Copy result</button>
      <button type="button" id="resetBtn">Clear</button>
    </div>
  </div>

<script>
  const FEE_RATE = 0.02;

  const paymentsEl = document.getElementById('payments');
  const walletEl = document.getElementById('wallet');
  const outPayments = document.getElementById('outPayments');
  const outFee = document.getElementById('outFee');
  const outWallet = document.getElementById('outWallet');
  const outResult = document.getElementById('outResult');
  const resultBox = document.getElementById('resultBox');
  const copyBtn = document.getElementById('copyBtn');
  const resetBtn = document.getElementById('resetBtn');

  let flashTimer = null;

  function fmt(n) {
    const sign = n < 0 ? '−' : '';
    return sign + '₱' + Math.abs(n).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function calc(animate) {
    const payments = parseFloat(paymentsEl.value) || 0;
    const wallet = parseFloat(walletEl.value) || 0;
    const fee = payments * FEE_RATE;
    const remit = payments - fee - wallet;

    outPayments.textContent = fmt(payments);
    outFee.textContent = '−' + fmt(fee);
    outWallet.textContent = '−' + fmt(wallet);
    outResult.textContent = fmt(remit);
    outResult.classList.toggle('neg', remit < 0);

    if (animate) {
      resultBox.classList.add('flash');
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => resultBox.classList.remove('flash'), 250);
    }

    try {
      localStorage.setItem('remit-calculator', JSON.stringify({ payments: paymentsEl.value, wallet: walletEl.value }));
    } catch (e) {}
  }

  try {
    const saved = JSON.parse(localStorage.getItem('remit-calculator') || 'null');
    if (saved) {
      paymentsEl.value = saved.payments || '';
      walletEl.value = saved.wallet || '';
    }
  } catch (e) {}

  paymentsEl.addEventListener('input', () => calc(true));
  walletEl.addEventListener('input', () => calc(true));

  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(outResult.textContent); } catch (e) {}
    const original = copyBtn.textContent;
    copyBtn.textContent = 'Copied';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = original;
      copyBtn.classList.remove('copied');
    }, 1200);
  });

  resetBtn.addEventListener('click', () => {
    paymentsEl.value = '';
    walletEl.value = '';
    try { localStorage.removeItem('remit-calculator'); } catch (e) {}
    calc(true);
    paymentsEl.focus();
  });

  calc(false);
</script>
</body>
</html>
